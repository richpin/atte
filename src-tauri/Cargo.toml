[package]
name = "atte"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
agent-client-protocol = "=2.1.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "process", "time", "io-util"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
tauri-plugin-dialog = "2.7.3"
nix = { version = "0.28.0", features = ["signal", "process"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tempfile = "3.27.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]

# Executable stdio test peer; excluded from normal application builds.
[[example]]
name = "acp-agent-fixture"
path = "tests/fixtures/agent.rs"
